# Render Blueprint: the FastAPI backend as a free Python web service.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then fill the secret env vars below.
services:
  - type: web
    name: fraud-analyzer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7 # same as the local venv
      # Secrets: set these in the Render dashboard (sync: false keeps them out of this file).
      - key: GEMINI_API_KEY
        sync: false
      - key: SAFE_BROWSING_API_KEY
        sync: false
      # Optional tier-2 AI fallback (Groq) when all Gemini models are unavailable.
      - key: GROQ_API_KEY
        sync: false
      # Optional: your exact Vercel URL(s), comma-separated. *.vercel.app is already allowed by default.
      - key: CORS_ORIGINS
        sync: false
