# Render Blueprint: the FastAPI backend as a free Python web service.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Then fill the secret env vars below.
services:
  - type: web
    name: fraud-analyzer-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # --no-server-header: don't advertise the server software (uvicorn) in every response.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-server-header
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7 # same as the local venv
      # Secrets: set these in the Render dashboard (sync: false keeps them out of this file).
      - key: GEMINI_API_KEY
        sync: false
      - key: SAFE_BROWSING_API_KEY
        sync: false
      # Optional tier-2 AI fallback (Groq) when all Gemini models are unavailable.
      - key: GROQ_API_KEY
        sync: false
      # Exact frontend origin(s) allowed by CORS, comma-separated (no wildcards).
      - key: CORS_ORIGINS
        value: https://fraud-detector-hackathon.vercel.app
      # Production hardening: hide /docs + /openapi.json; read the real client IP from Render's proxy.
      - key: ENABLE_DOCS
        value: "false"
      - key: TRUST_PROXY_HEADERS
        value: "true"
